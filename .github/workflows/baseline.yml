name: Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare evidence directories
        run: mkdir -p baseline-logs baseline-results baseline-artifacts baseline-test-results

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gate 1 - npm install
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee baseline-logs/01-install.log

      - name: Gate 2 - typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee baseline-logs/02-typecheck.log

      - name: Gate 3 - unit test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee baseline-logs/03-test.log
          cp baseline-logs/03-test.log baseline-test-results/test.log

      - name: Gate 4 - production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee baseline-logs/04-build.log
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          compgen -G 'dist/workbox-*.js' > /dev/null
          compgen -G 'dist/assets/*.js' > /dev/null
          grep -q 'index.html' dist/sw.js
          grep -Eq 'assets/[^"'"']+\.js' dist/sw.js
          find dist -maxdepth 2 -type f -print | sort | tee baseline-artifacts/dist-files.txt
          grep -oE 'assets/[^"'"']+\.(js|css)' dist/sw.js | sort -u | tee baseline-artifacts/offline-precache-assets.txt

      - name: Record success
        if: success()
        run: |
          printf 'install=PASS\ntypecheck=PASS\ntest=PASS\nbuild=PASS\n' > baseline-results/gates.txt

      - name: Record workflow status
        if: always()
        run: |
          echo "job_status=${{ job.status }}" > baseline-results/workflow-status.txt

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            baseline-logs/**
            baseline-results/**
            baseline-artifacts/**
            baseline-test-results/**
            dist/**
