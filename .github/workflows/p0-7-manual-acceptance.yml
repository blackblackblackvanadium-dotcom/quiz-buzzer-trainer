name: P0-7 Manual Acceptance Evidence

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  acceptance:
    if: github.head_ref == 'p0-7-acceptance-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout acceptance harness branch
        uses: actions/checkout@v4

      - name: Verify target Baseline run belongs to accepted HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/34784140753 --jq .head_sha)" = "2feafdcef98c7879de4cf4834e10dc7ef084fb1e"

      - name: Download exact Baseline #60 built PWA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/baseline60
          gh run download 34784140753 -n baseline-evidence-34784140753 -D /tmp/baseline60
          test -f /tmp/baseline60/dist/index.html
          test -f /tmp/baseline60/dist/sw.js
          test -f /tmp/baseline60/dist/manifest.webmanifest

      - name: Normalize acceptance harness for deterministic browser control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/p0-7-manual-acceptance.mjs')
          text = path.read_text()

          start_marker = '''  await cdp.evaluate("document.querySelector('#answer-input').value = '不正解';'''
          end_marker = '''  await cdp.waitFor("!!document.querySelector('.result-card')");'''
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + '''  await cdp.evaluate("document.querySelector('.answer-panel').requestSubmit()");\n''' + text[end:]

          progression_start_marker = '''  await cdp.evaluate("document.querySelector('.result-card .primary-button').click()");'''
          progression_end_marker = '''  await cdp.evaluate("[...document.querySelectorAll('button')].find((button) => button.textContent.includes('メニューへ戻る')).click()");'''
          progression_start = text.index(progression_start_marker)
          progression_end = text.index(progression_end_marker, progression_start)
          replacement = '''  await cdp.evaluate("[...document.querySelectorAll('button')].find((button) => button.textContent.trim() === '終了').click()");\n  await cdp.waitFor("document.body.innerText.includes('Session ended')");\n'''
          text = text[:progression_start] + replacement + text[progression_end:]

          offline_start_marker = "  await cdp.call('Network.emulateNetworkConditions', { offline: true, latency: 0, downloadThroughput: 0, uploadThroughput: 0 });"
          waiting_start_marker = '''  await cdp.evaluate("window.__acceptanceSentinel = 'active-session-preserved'");'''
          offline_start = text.index(offline_start_marker)
          waiting_start = text.index(waiting_start_marker, offline_start)
          offline_block = r'''  await new Promise((resolvePromise, rejectPromise) => {
    server.close((error) => error ? rejectPromise(error) : resolvePromise());
  });
  evidence.checks.offlineTransport = { originServerClosed: true };
  await cdp.call('Page.navigate', { url: 'about:blank' });
  await cdp.waitFor("location.href === 'about:blank'");
  await cdp.call('Page.navigate', { url: `${origin}/` });
  await cdp.waitFor("[...document.querySelectorAll('button')].some((button) => button.textContent.includes('Normalを開始'))", 20000);
  evidence.checks.offlineColdStart = await cdp.evaluate("({ navigatorOnline: navigator.onLine, normalStart: [...document.querySelectorAll('button')].some((button) => button.textContent.includes('Normalを開始')), controller: !!navigator.serviceWorker.controller, htmlScrollWidth: document.documentElement.scrollWidth })");
  const offline = evidence.checks.offlineColdStart;
  assert(offline.normalStart && offline.controller, 'Offline cold-start shell failed with origin server stopped');
  assert(offline.htmlScrollWidth <= 320, 'Offline cold-start has horizontal overflow');
  await cdp.evaluate("window.dispatchEvent(new Event('offline'))");
  await cdp.waitFor("document.body.innerText.includes('オフライン — ローカルデータで利用中')");
  evidence.checks.offlineIndicator = await cdp.evaluate("({ indicator: document.body.innerText.includes('オフライン — ローカルデータで利用中') })");
  assert(evidence.checks.offlineIndicator.indicator, 'Offline indicator did not appear after browser offline event');
  await cdp.evaluate("[...document.querySelectorAll('button')].find((button) => button.textContent.includes('Normalを開始')).click()");
  await cdp.waitFor("[...document.querySelectorAll('button')].some((button) => button.textContent.trim() === '開始')");
  await cdp.evaluate("[...document.querySelectorAll('button')].find((button) => button.textContent.trim() === '開始').click()");
  await cdp.waitFor("!!document.querySelector('.buzz-button')", 15000);
  evidence.checks.offlineCoreQuiz = await cdp.evaluate("({ buzz: !!document.querySelector('.buzz-button'), question: !!document.querySelector('.question-text'), indicator: document.body.innerText.includes('オフライン — ローカルデータで利用中') })");
  assert(evidence.checks.offlineCoreQuiz.buzz && evidence.checks.offlineCoreQuiz.question && evidence.checks.offlineCoreQuiz.indicator, 'Core quiz cannot start from offline cold-start');
  await cdp.screenshot('04-offline-core-quiz.png');

  await new Promise((resolvePromise, rejectPromise) => {
    server.once('error', rejectPromise);
    server.listen(address.port, '127.0.0.1', resolvePromise);
  });
  await cdp.evaluate("window.dispatchEvent(new Event('online'))");
'''
          text = text[:offline_start] + offline_block + text[waiting_start:]
          path.write_text(text)
          PY

      - name: Run 320px / Safe Area / Enter / offline / waiting-SW acceptance
        run: |
          set -euo pipefail
          node scripts/p0-7-manual-acceptance.mjs /tmp/baseline60/dist p0-7-evidence

      - name: Upload P0 #7 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-7-manual-acceptance-${{ github.run_id }}
          if-no-files-found: error
          path: p0-7-evidence/**
