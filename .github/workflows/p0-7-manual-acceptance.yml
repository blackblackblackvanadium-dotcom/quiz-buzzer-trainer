name: P0-7 Manual Acceptance Evidence

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  acceptance:
    if: github.head_ref == 'p0-7-acceptance-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout acceptance harness branch
        uses: actions/checkout@v4

      - name: Verify target Baseline run belongs to accepted HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/34784140753 --jq .head_sha)" = "2feafdcef98c7879de4cf4834e10dc7ef084fb1e"

      - name: Download exact Baseline #60 built PWA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/baseline60
          gh run download 34784140753 -n baseline-evidence-34784140753 -D /tmp/baseline60
          test -f /tmp/baseline60/dist/index.html
          test -f /tmp/baseline60/dist/sw.js
          test -f /tmp/baseline60/dist/manifest.webmanifest

      - name: Normalize harness continuation after held-Enter check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/p0-7-manual-acceptance.mjs')
          text = path.read_text()

          start_marker = '''  await cdp.evaluate("document.querySelector('#answer-input').value = '不正解';'''
          end_marker = '''  await cdp.waitFor("!!document.querySelector('.result-card')");'''
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + '''  await cdp.evaluate("document.querySelector('.answer-panel').requestSubmit()");\n''' + text[end:]

          old_progression = '''  await cdp.evaluate("document.querySelector('.result-card .primary-button').click()");
          await cdp.waitFor("document.body.innerText.includes('Session complete')");'''
          new_progression = '''  await cdp.evaluate("[...document.querySelectorAll('button')].find((button) => button.textContent.trim() === '終了').click()");
          await cdp.waitFor("document.body.innerText.includes('Session ended')");'''
          if text.count(old_progression) != 1:
              raise SystemExit('Expected result-to-session progression block not found exactly once')
          text = text.replace(old_progression, new_progression)
          path.write_text(text)
          PY

      - name: Run 320px / Safe Area / Enter / offline / waiting-SW acceptance
        run: |
          set -euo pipefail
          node scripts/p0-7-manual-acceptance.mjs /tmp/baseline60/dist p0-7-evidence

      - name: Upload P0 #7 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-7-manual-acceptance-${{ github.run_id }}
          if-no-files-found: error
          path: p0-7-evidence/**
