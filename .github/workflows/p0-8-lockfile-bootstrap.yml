name: P0-8 Lockfile Bootstrap

on:
  push:
    branches: [p0-8-lockfile-bootstrap]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen release candidate source
        uses: actions/checkout@v4
        with:
          ref: 2cb63eebd34208b9dbd68936c19bacb208f221bd

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock only
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -f package-lock.json
          sha256sum package-lock.json | tee package-lock.sha256
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3) process.exit(1);"

      - name: Upload lockfile bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: p0-8-lockfile-bootstrap-${{ github.run_id }}
          if-no-files-found: error
          path: |
            package-lock.json
            package-lock.sha256
